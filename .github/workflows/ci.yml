name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Patch eMudhra CA compromise
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --only-upgrade -y ca-certificates
        sudo update-ca-certificates --fresh

    - name: Distrust remaining eMudhra/emSign roots (system store)
      # eMudhra CA compromise (DOCOPS-203). The apt step above is the fix for the
      # system store: Ubuntu ca-certificates 20260816ubuntu0.24.04.1 (20 Oct 2026)
      # blacklists emSign ECC Root CA - G3, the root the compromised intermediates
      # sit under. This step additionally drops the remaining eMudhra/emSign roots
      # (not named in the incident; belt and braces) and points OpenSSL at the
      # filtered bundle (curl, git, python) for the rest of the job. SSL_CERT_DIR is
      # an empty directory so OpenSSL does not also load /etc/ssl/certs. Node is
      # covered by the 24.22.1 pin; GitHub does not allow NODE_OPTIONS to be set
      # through GITHUB_ENV, so Node is not pointed at this bundle.
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/ca-empty"
        python3 - <<'PY'
        import os, re, subprocess
        certs = re.findall(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----\n',
                           open('/etc/ssl/certs/ca-certificates.crt').read(), re.S)
        keep, drop = [], 0
        for c in certs:
            subj = subprocess.run(['openssl', 'x509', '-noout', '-subject'], input=c,
                                  capture_output=True, text=True).stdout
            if re.search(r'emsign|emudhra', subj, re.I):
                drop += 1
            else:
                keep.append(c)
        assert len(keep) > 100, 'CA bundle unexpectedly small'
        out = os.path.join(os.environ['RUNNER_TEMP'], 'ca-bundle-no-emudhra.crt')
        open(out, 'w').write(''.join(keep))
        print(f'kept {len(keep)} roots, removed {drop} eMudhra/emSign roots')
        PY
        {
          echo "SSL_CERT_FILE=$RUNNER_TEMP/ca-bundle-no-emudhra.crt"
          echo "SSL_CERT_DIR=$RUNNER_TEMP/ca-empty"
        } >> "$GITHUB_ENV"

    - uses: actions/checkout@v4

    - name: Use Node.js 24.22.1
      uses: actions/setup-node@v4
      with:
        node-version: '24.22.1'
    - run: npm install
    - run: npm run lint
    - run: npm run build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.DEVREL_GH_OIDC_ROLE_ARN }}
        aws-region: eu-west-1
        role-session-name: GitHub-OIDC-docs-ui

    - name: Sync UI Bundle to S3
      env:
        AWS_S3_BUCKET: ${{ secrets.STATIC_CONTENT_BUCKET }}
      # if the AWS_S3_BUCKET is undefined, the task will fail
      # also make sure that we are on master before publishing the "latest" version
      if: ${{ env.AWS_S3_BUCKET != '' && github.ref == 'refs/heads/master' }}
      run: |
        aws s3 sync --follow-symlinks --include '*.zip' --no-progress build s3://${{ secrets.STATIC_CONTENT_BUCKET }}/build

  # The build job above covers 24.22.1 (and publishes). This checks the other
  # Node releases allowed by engines in package.json.
  node-compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.23.4', '26.12.1']

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - run: npm run lint
    - run: npm run build
